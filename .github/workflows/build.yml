name: Build TRON Permission Control

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows
    runs-on: windows-latest

    defaults:
      run:
        working-directory: TronV3.1-final-upload

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Check project
        run: npm run check

      - name: Build Windows
        run: npm run dist:win

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: TRON-Permission-Control-Windows
          path: |
            TronV3.1-final-upload/dist/*.exe
            TronV3.1-final-upload/dist/*.zip
            TronV3.1-final-upload/dist/*.yml

  build-macos:
    name: Build macOS
    runs-on: macos-latest

    defaults:
      run:
        working-directory: TronV3.1-final-upload

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Check project
        run: npm run check

      - name: Build macOS
        run: npm run dist:mac

      - name: Upload macOS build
        uses: actions/upload-artifact@v4
        with:
          name: TRON-Permission-Control-macOS
          path: |
            TronV3.1-final-upload/dist/*.dmg
            TronV3.1-final-upload/dist/*.zip
            TronV3.1-final-upload/dist/*.yml
