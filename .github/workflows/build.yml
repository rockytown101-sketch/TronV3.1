name: Build TRON Permission Control

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Static checks
        run: npm run check

      - name: Build Windows
        run: npm run dist:win -- --publish never
      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TRON-Permission-Control-Windows
          path: |
            dist/*.exe
            dist/*.yml
          if-no-files-found: error

  build-macos:
    name: Build macOS
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Static checks
        run: npm run check

      - name: Build macOS
        run: npm run dist:mac -- --publish never

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TRON-Permission-Control-macOS
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.yml
          if-no-files-found: error
